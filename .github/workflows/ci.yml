name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier la matrice de couverture
        run: pnpm test:matrix
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Vérifier le lint
        run: pnpm lint
      - name: Exécuter les tests unitaires
        run: pnpm test
      - name: Valider les contenus
        run: pnpm content:validate
      - name: Vérifier la documentation
        run: pnpm docs:check
      - name: Construire l'application
        run: pnpm exec next build --webpack

  isolated:
    name: PostgreSQL local et E2E obligatoires
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      LOCAL_FIXTURE_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Refuser un E2E sans secret de fixture
        run: |
          if [ -z "$E2E_PASSWORD" ]; then
            echo "::error::Le secret E2E_PASSWORD est obligatoire pour la recette multijoueur."
            exit 1
          fi
      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Démarrer Supabase local
        run: supabase start
      - name: Réinitialiser la base isolée
        run: supabase db reset
      - name: Préparer les variables locales éphémères
        run: pnpm local:env
      - name: Créer Alice, Bob et le tiers non membre
        run: pnpm local:fixture
      - name: Exécuter les tests pgTAP
        run: pnpm test:db
      - name: Exécuter les E2E multijoueurs
        run: pnpm test:e2e
