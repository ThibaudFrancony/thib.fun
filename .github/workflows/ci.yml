name: Vérifications

# CI sans Docker : aucun conteneur Supabase/Postgres n'est démarré ici.
# La recette Docker (pgTAP + E2E multijoueurs) est volontairement manuelle
# via `.github/workflows/docker-e2e.yml` (workflow_dispatch uniquement),
# pour ne pas imposer Docker Desktop / RAM à chaque push.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier la matrice de couverture
        run: pnpm test:matrix
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Vérifier le lint
        run: pnpm lint
      - name: Exécuter les tests unitaires
        run: pnpm test
      - name: Valider les contenus
        run: pnpm content:validate
      - name: Vérifier la documentation
        run: pnpm docs:check
      - name: Construire l'application
        run: pnpm exec next build --webpack
